# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║                         NERDYOS KEYBINDINGS                                ║
# ║                       Hyprland-Inspired Syntax                             ║
# ╚═══════════════════════════════════════════════════════════════════════════╝
#
# Syntax: bind = MODIFIERS, KEY, ACTION, ARGUMENTS
#         bindm = MODIFIERS, MOUSE, ACTION (mouse bindings)
#
# Modifiers: SUPER, SHIFT, CTRL, ALT (combine with +)
# Special: $mod is an alias for SUPER

$mod = SUPER

# ═══════════════════════════════════════════════════════════════════════════════
# APPLICATION LAUNCHERS
# ═══════════════════════════════════════════════════════════════════════════════

# Terminal
bind = $mod, Return, exec, terminal

# Application launcher (Rofi-style)
bind = $mod, D, exec, launcher

# File manager
bind = $mod, E, exec, finder

# Browser
bind = $mod, B, exec, browser

# Settings
bind = $mod, I, exec, settings

# Spotlight-style search
bind = $mod, Space, exec, launcher

# ═══════════════════════════════════════════════════════════════════════════════
# WINDOW MANAGEMENT
# ═══════════════════════════════════════════════════════════════════════════════

# Close active window
bind = $mod, Q, killactive

# Toggle fullscreen
bind = $mod, F, fullscreen, 0

# Toggle maximize (fullscreen but with bar)
bind = $mod SHIFT, F, fullscreen, 1

# Toggle floating mode
bind = $mod SHIFT, Space, togglefloating

# Toggle pseudo-tiling
bind = $mod, P, pseudo

# Toggle split direction (dwindle)
bind = $mod, T, togglesplit

# Center floating window
bind = $mod, C, centerwindow

# Pin window (always on top)
bind = $mod SHIFT, P, pin

# ═══════════════════════════════════════════════════════════════════════════════
# WINDOW FOCUS (Vim-style: hjkl)
# ═══════════════════════════════════════════════════════════════════════════════

bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

# Arrow key alternatives
bind = $mod, Left, movefocus, l
bind = $mod, Right, movefocus, r
bind = $mod, Up, movefocus, u
bind = $mod, Down, movefocus, d

# Cycle through windows
bind = $mod, Tab, cyclenext
bind = $mod SHIFT, Tab, cycleprev

# Focus urgent window
bind = $mod, U, focusurgentorlast

# ═══════════════════════════════════════════════════════════════════════════════
# WINDOW MOVEMENT (Vim-style: Shift + hjkl)
# ═══════════════════════════════════════════════════════════════════════════════

bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, J, movewindow, d

# Arrow key alternatives
bind = $mod SHIFT, Left, movewindow, l
bind = $mod SHIFT, Right, movewindow, r
bind = $mod SHIFT, Up, movewindow, u
bind = $mod SHIFT, Down, movewindow, d

# Swap with master (master layout)
bind = $mod, M, layoutmsg, swapwithmaster

# ═══════════════════════════════════════════════════════════════════════════════
# WINDOW RESIZE (Vim-style: Ctrl + hjkl)
# ═══════════════════════════════════════════════════════════════════════════════

bind = $mod CTRL, H, resizeactive, -40 0
bind = $mod CTRL, L, resizeactive, 40 0
bind = $mod CTRL, K, resizeactive, 0 -40
bind = $mod CTRL, J, resizeactive, 0 40

# Arrow key alternatives
bind = $mod CTRL, Left, resizeactive, -40 0
bind = $mod CTRL, Right, resizeactive, 40 0
bind = $mod CTRL, Up, resizeactive, 0 -40
bind = $mod CTRL, Down, resizeactive, 0 40

# Enter resize submap (for continuous resizing)
bind = $mod, R, submap, resize

# Resize submap
submap = resize
bind = , H, resizeactive, -20 0
bind = , L, resizeactive, 20 0
bind = , K, resizeactive, 0 -20
bind = , J, resizeactive, 0 20
bind = , Left, resizeactive, -20 0
bind = , Right, resizeactive, 20 0
bind = , Up, resizeactive, 0 -20
bind = , Down, resizeactive, 0 20
bind = , Escape, submap, reset
bind = , Return, submap, reset
submap = reset

# ═══════════════════════════════════════════════════════════════════════════════
# WORKSPACE SWITCHING
# ═══════════════════════════════════════════════════════════════════════════════

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Next/Previous workspace
bind = $mod, BracketRight, workspace, e+1
bind = $mod, BracketLeft, workspace, e-1

# Scroll through workspaces (mouse)
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# Create new workspace
bind = $mod SHIFT, N, createworkspace

# ═══════════════════════════════════════════════════════════════════════════════
# MOVE WINDOW TO WORKSPACE
# ═══════════════════════════════════════════════════════════════════════════════

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Move to next/previous workspace (and follow)
bind = $mod SHIFT, BracketRight, movetoworkspace, e+1
bind = $mod SHIFT, BracketLeft, movetoworkspace, e-1

# Move silently (don't follow)
bind = $mod ALT, 1, movetoworkspacesilent, 1
bind = $mod ALT, 2, movetoworkspacesilent, 2
bind = $mod ALT, 3, movetoworkspacesilent, 3
bind = $mod ALT, 4, movetoworkspacesilent, 4
bind = $mod ALT, 5, movetoworkspacesilent, 5

# ═══════════════════════════════════════════════════════════════════════════════
# SCRATCHPADS (Special Workspaces)
# ═══════════════════════════════════════════════════════════════════════════════

# Toggle scratchpad
bind = $mod, S, togglespecialworkspace, scratchpad

# Move window to scratchpad
bind = $mod SHIFT, S, movetoworkspace, special:scratchpad

# Secondary scratchpad (e.g., for terminal)
bind = $mod, Grave, togglespecialworkspace, terminal
bind = $mod SHIFT, Grave, movetoworkspace, special:terminal

# ═══════════════════════════════════════════════════════════════════════════════
# LAYOUT MANAGEMENT
# ═══════════════════════════════════════════════════════════════════════════════

# Switch layout
bind = $mod ALT, D, exec, layoutmsg, layout dwindle
bind = $mod ALT, M, exec, layoutmsg, layout master

# Master layout: increase/decrease master count
bind = $mod, Equal, layoutmsg, addmaster
bind = $mod, Minus, layoutmsg, removemaster

# Master layout: rotate orientation
bind = $mod, O, layoutmsg, orientationnext

# ═══════════════════════════════════════════════════════════════════════════════
# MOUSE BINDINGS
# ═══════════════════════════════════════════════════════════════════════════════

# Move window with Super + LMB
bindm = $mod, mouse:272, movewindow

# Resize window with Super + RMB
bindm = $mod, mouse:273, resizewindow

# ═══════════════════════════════════════════════════════════════════════════════
# SYSTEM ACTIONS
# ═══════════════════════════════════════════════════════════════════════════════

# Power menu
bind = $mod, X, exec, powermenu

# Lock screen
bind = $mod, Escape, exec, lock

# Screenshot (full screen)
bind = , Print, exec, screenshot

# Screenshot (region)
bind = SHIFT, Print, exec, screenshot region

# Screenshot (window)
bind = $mod, Print, exec, screenshot window

# Toggle notifications
bind = $mod, N, exec, togglenotify

# Reload configuration
bind = $mod SHIFT, R, exec, reload

# ═══════════════════════════════════════════════════════════════════════════════
# MEDIA KEYS
# ═══════════════════════════════════════════════════════════════════════════════

# Volume
bind = , XF86AudioRaiseVolume, exec, volume up
bind = , XF86AudioLowerVolume, exec, volume down
bind = , XF86AudioMute, exec, volume mute

# Brightness
bind = , XF86MonBrightnessUp, exec, brightness up
bind = , XF86MonBrightnessDown, exec, brightness down

# Media playback
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# ═══════════════════════════════════════════════════════════════════════════════
# DEVELOPER MODE
# ═══════════════════════════════════════════════════════════════════════════════

# Toggle debug overlay
bind = $mod SHIFT, D, exec, devtoggle

# Keybind inspector
bind = $mod, Slash, exec, keybindinspector
