# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║                         NERDYOS WINDOW RULES                               ║
# ║                       Hyprland-Inspired Syntax                             ║
# ╚═══════════════════════════════════════════════════════════════════════════╝
#
# Syntax: windowrule = RULE, WINDOW_MATCH
#         windowrulev2 = RULE, MATCH_CONDITION, MATCH_CONDITION, ...
#
# Window matching:
#   class:     Match by window class (app ID)
#   title:     Match by window title
#   floating:  Match floating windows
#   fullscreen: Match fullscreen windows
#
# Rules:
#   float          - Make window floating
#   tile           - Make window tiled
#   fullscreen     - Make window fullscreen
#   maximize       - Maximize window
#   center         - Center floating window
#   size W H       - Set initial size
#   minsize W H    - Set minimum size
#   maxsize W H    - Set maximum size
#   move X Y       - Set initial position
#   workspace N    - Assign to workspace
#   opacity A I    - Set active/inactive opacity
#   nofocus        - Don't focus on open
#   pin            - Pin window (always visible)
#   noanim         - Disable animations
#   noborder       - Remove border
#   noshadow       - Remove shadow
#   noblur         - Disable blur behind

# ═══════════════════════════════════════════════════════════════════════════════
# FLOATING WINDOWS
# ═══════════════════════════════════════════════════════════════════════════════

# Calculator - always float, small size
windowrule = float, class:^(calculator)$
windowrule = size 320 480, class:^(calculator)$
windowrule = center, class:^(calculator)$

# Settings - float with specific size
windowrule = float, class:^(settings)$
windowrule = size 900 650, class:^(settings)$
windowrule = center, class:^(settings)$

# System Monitor - float
windowrule = float, class:^(monitor)$
windowrule = size 600 450, class:^(monitor)$

# Messages - float on right
windowrule = float, class:^(messages)$
windowrule = size 400 600, class:^(messages)$
windowrule = move 100%-420 60, class:^(messages)$

# Notes - small floating
windowrule = float, class:^(notes)$
windowrule = size 500 400, class:^(notes)$

# ═══════════════════════════════════════════════════════════════════════════════
# OPACITY RULES
# ═══════════════════════════════════════════════════════════════════════════════

# Terminal - slightly transparent
windowrule = opacity 0.95 0.85, class:^(terminal)$

# Notes - paper-like
windowrule = opacity 0.98 0.90, class:^(notes)$

# Browser - full opacity
windowrule = opacity 1.0 0.95, class:^(browser)$

# ═══════════════════════════════════════════════════════════════════════════════
# WORKSPACE ASSIGNMENTS
# ═══════════════════════════════════════════════════════════════════════════════

# Browser goes to workspace 1
windowrule = workspace 1, class:^(browser)$

# Terminal prefers workspace 2
windowrule = workspace 2 silent, class:^(terminal)$

# File manager on workspace 3
windowrule = workspace 3 silent, class:^(finder)$

# Code editors on workspace 4
windowrule = workspace 4 silent, class:^(ide)$
windowrule = workspace 4 silent, class:^(code_editor)$

# Media on workspace 8
windowrule = workspace 8 silent, class:^(media)$

# Messages/Communication on workspace 9
windowrule = workspace 9 silent, class:^(messages)$
windowrule = workspace 9 silent, class:^(mail)$

# System tools on workspace 10
windowrule = workspace 10 silent, class:^(monitor)$
windowrule = workspace 10 silent, class:^(settings)$

# ═══════════════════════════════════════════════════════════════════════════════
# SPECIAL BEHAVIORS
# ═══════════════════════════════════════════════════════════════════════════════

# Store app - center and float
windowrule = float, class:^(store)$
windowrule = size 950 650, class:^(store)$
windowrule = center, class:^(store)$

# Calendar - float
windowrule = float, class:^(calendar)$
windowrule = size 800 600, class:^(calendar)$
windowrule = center, class:^(calendar)$

# Document viewer - maximize by default
windowrule = maximize, class:^(doc)$

# PDF reader - maximize
windowrule = maximize, class:^(pdf_reader)$

# ═══════════════════════════════════════════════════════════════════════════════
# DIALOG/POPUP RULES
# ═══════════════════════════════════════════════════════════════════════════════

# All dialogs/popups should float
windowrulev2 = float, title:^(Open File)$
windowrulev2 = float, title:^(Save File)$
windowrulev2 = float, title:^(Save As)$
windowrulev2 = float, title:^(Confirm)$
windowrulev2 = float, title:^(Alert)$
windowrulev2 = float, title:^(Error)$
windowrulev2 = float, title:^(Warning)$

# Center dialogs
windowrulev2 = center, title:^(Open File)$
windowrulev2 = center, title:^(Save File)$
windowrulev2 = center, title:^(Save As)$
windowrulev2 = center, title:^(Confirm)$

# ═══════════════════════════════════════════════════════════════════════════════
# SCRATCHPAD RULES
# ═══════════════════════════════════════════════════════════════════════════════

# Define scratchpad windows (these will be sent to special workspace)
# windowrule = workspace special:scratchpad, title:^(scratchpad)$

# Scratchpad terminal
windowrulev2 = float, class:^(terminal)$, title:^(scratchpad)$
windowrulev2 = size 800 500, class:^(terminal)$, title:^(scratchpad)$
windowrulev2 = center, class:^(terminal)$, title:^(scratchpad)$
windowrulev2 = workspace special:scratchpad, class:^(terminal)$, title:^(scratchpad)$

# ═══════════════════════════════════════════════════════════════════════════════
# ANIMATION OVERRIDES
# ═══════════════════════════════════════════════════════════════════════════════

# Disable animations for specific apps if needed
# windowrule = noanim, class:^(someapp)$

# ═══════════════════════════════════════════════════════════════════════════════
# LAYER RULES (for overlays, bars, notifications)
# ═══════════════════════════════════════════════════════════════════════════════

# Notifications - no focus, always on top
layerrule = nofocus, notification
layerrule = blur, notification

# Launcher - blur background
layerrule = blur, launcher
layerrule = ignorezero, launcher

# Bar - blur
layerrule = blur, bar
