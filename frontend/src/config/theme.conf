# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║                         NERDYOS THEME CONFIGURATION                        ║
# ║                          Catppuccin Mocha (Default)                        ║
# ╚═══════════════════════════════════════════════════════════════════════════╝
#
# This file defines the color scheme for NerdyOS.
# Available presets: catppuccin-mocha, catppuccin-macchiato, catppuccin-frappe,
#                    catppuccin-latte, gruvbox-dark, gruvbox-light,
#                    tokyo-night, tokyo-night-storm, nord, dracula

# Active theme preset
theme = catppuccin-mocha

# ═══════════════════════════════════════════════════════════════════════════════
# CATPPUCCIN MOCHA PALETTE
# ═══════════════════════════════════════════════════════════════════════════════

# Base colors
$rosewater = rgb(f5e0dc)
$flamingo = rgb(f2cdcd)
$pink = rgb(f5c2e7)
$mauve = rgb(cba6f7)
$red = rgb(f38ba8)
$maroon = rgb(eba0ac)
$peach = rgb(fab387)
$yellow = rgb(f9e2af)
$green = rgb(a6e3a1)
$teal = rgb(94e2d5)
$sky = rgb(89dceb)
$sapphire = rgb(74c7ec)
$blue = rgb(89b4fa)
$lavender = rgb(b4befe)

# Text colors
$text = rgb(cdd6f4)
$subtext1 = rgb(bac2de)
$subtext0 = rgb(a6adc8)

# Overlay colors
$overlay2 = rgb(9399b2)
$overlay1 = rgb(7f849c)
$overlay0 = rgb(6c7086)

# Surface colors
$surface2 = rgb(585b70)
$surface1 = rgb(45475a)
$surface0 = rgb(313244)

# Background colors
$base = rgb(1e1e2e)
$mantle = rgb(181825)
$crust = rgb(11111b)

# ═══════════════════════════════════════════════════════════════════════════════
# SEMANTIC COLOR MAPPINGS
# ═══════════════════════════════════════════════════════════════════════════════

colors {
    # Primary accent color
    accent = $mauve

    # Secondary accent
    secondary = $blue

    # Success/positive
    success = $green

    # Warning
    warning = $yellow

    # Error/danger
    error = $red

    # Info
    info = $sapphire
}

# ═══════════════════════════════════════════════════════════════════════════════
# WINDOW DECORATION COLORS
# ═══════════════════════════════════════════════════════════════════════════════

decoration {
    # Active window border (gradient supported)
    col.active_border = $mauve $blue 45deg

    # Inactive window border
    col.inactive_border = $surface0

    # Shadow color
    col.shadow = $crust

    # Active window shadow (optional, different from inactive)
    col.shadow_active = rgba(203, 166, 247, 0.3)
}

# ═══════════════════════════════════════════════════════════════════════════════
# BAR COLORS
# ═══════════════════════════════════════════════════════════════════════════════

bar {
    # Bar background
    background = $base

    # Bar background opacity (0.0 - 1.0)
    opacity = 0.9

    # Module text color
    foreground = $text

    # Workspace button colors
    workspace.active = $mauve
    workspace.inactive = $surface1
    workspace.urgent = $red
    workspace.hover = $surface2

    # Module-specific colors
    clock.color = $text
    battery.charging = $green
    battery.low = $red
    battery.normal = $text
    network.connected = $green
    network.disconnected = $red
    audio.muted = $overlay0
    audio.normal = $text
}

# ═══════════════════════════════════════════════════════════════════════════════
# LAUNCHER COLORS
# ═══════════════════════════════════════════════════════════════════════════════

launcher {
    # Background
    background = $base
    background_opacity = 0.95

    # Border
    border = $surface1
    border_width = 2

    # Input field
    input.background = $surface0
    input.foreground = $text
    input.placeholder = $overlay0

    # Results
    result.background = transparent
    result.foreground = $text
    result.selected.background = $surface1
    result.selected.foreground = $text

    # Category headers
    category.foreground = $subtext0

    # Match highlight
    match.foreground = $mauve
}

# ═══════════════════════════════════════════════════════════════════════════════
# NOTIFICATION COLORS
# ═══════════════════════════════════════════════════════════════════════════════

notification {
    # Background
    background = $surface0
    background_opacity = 0.95

    # Border
    border = $surface1

    # Text
    foreground = $text
    title = $text
    body = $subtext1

    # Urgency levels
    low.border = $blue
    normal.border = $mauve
    critical.border = $red
    critical.background = $red

    # Progress bar
    progress.background = $surface1
    progress.foreground = $mauve
}

# ═══════════════════════════════════════════════════════════════════════════════
# POWER MENU COLORS
# ═══════════════════════════════════════════════════════════════════════════════

powermenu {
    # Background overlay
    background = rgba(17, 17, 27, 0.8)

    # Button colors
    button.background = $surface0
    button.foreground = $text
    button.hover = $surface1
    button.active = $mauve

    # Icon colors
    icon.lock = $blue
    icon.logout = $yellow
    icon.suspend = $teal
    icon.reboot = $peach
    icon.shutdown = $red
}

# ═══════════════════════════════════════════════════════════════════════════════
# APPLICATION COLORS
# ═══════════════════════════════════════════════════════════════════════════════

apps {
    # Terminal colors (used by NerdyShell)
    terminal.background = $base
    terminal.foreground = $text
    terminal.cursor = $rosewater
    terminal.selection = $surface2

    # ANSI colors
    terminal.black = $surface1
    terminal.red = $red
    terminal.green = $green
    terminal.yellow = $yellow
    terminal.blue = $blue
    terminal.magenta = $pink
    terminal.cyan = $teal
    terminal.white = $subtext1

    # Bright ANSI colors
    terminal.bright_black = $surface2
    terminal.bright_red = $red
    terminal.bright_green = $green
    terminal.bright_yellow = $yellow
    terminal.bright_blue = $blue
    terminal.bright_magenta = $pink
    terminal.bright_cyan = $teal
    terminal.bright_white = $text
}

# ═══════════════════════════════════════════════════════════════════════════════
# WALLPAPER
# ═══════════════════════════════════════════════════════════════════════════════

wallpaper {
    # Default wallpaper URL or path
    default = https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=2070

    # Per-workspace wallpapers (optional)
    # workspace.1 = /path/to/wallpaper1.jpg
    # workspace.2 = /path/to/wallpaper2.jpg

    # Wallpaper mode: fill, fit, center, tile, stretch
    mode = fill

    # Blur wallpaper behind windows (uses general blur settings)
    blur = true
}

# ═══════════════════════════════════════════════════════════════════════════════
# CURSOR
# ═══════════════════════════════════════════════════════════════════════════════

cursor {
    # Cursor theme (for future use)
    theme = default

    # Cursor size
    size = 24

    # Cursor color (if supported)
    color = $rosewater
}

# ═══════════════════════════════════════════════════════════════════════════════
# FONTS
# ═══════════════════════════════════════════════════════════════════════════════

fonts {
    # UI font
    ui = "Inter", sans-serif

    # Monospace font (terminal, code)
    mono = "JetBrains Mono", "Fira Code", monospace

    # UI font size
    size = 13

    # Monospace font size
    mono_size = 12
}
