# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║                         NERDYOS CONFIGURATION                              ║
# ║                       Hyprland-Inspired Syntax                             ║
# ╚═══════════════════════════════════════════════════════════════════════════╝
#
# This is the main configuration file for NerdyOS.
# Syntax: key = value (for simple values)
#         section { key = value } (for grouped settings)
#
# Use `source = path` to include modular config files.

# ═══════════════════════════════════════════════════════════════════════════════
# GENERAL SETTINGS
# ═══════════════════════════════════════════════════════════════════════════════

general {
    # Gaps between windows (inner gap)
    gaps_in = 5

    # Gaps from screen edges (outer gap)
    gaps_out = 15

    # Border width in pixels
    border_size = 2

    # Active window border color (supports gradients with angle)
    col.active_border = rgba(cba6f7ee) rgba(89b4faee) 45deg

    # Inactive window border color
    col.inactive_border = rgba(313244aa)

    # Default layout: dwindle, master, or floating
    layout = dwindle

    # Allow resizing windows by dragging borders
    resize_on_border = true

    # Hover to focus (sloppy focus)
    focus_on_hover = false
}

# ═══════════════════════════════════════════════════════════════════════════════
# DECORATION SETTINGS
# ═══════════════════════════════════════════════════════════════════════════════

decoration {
    # Corner rounding radius in pixels
    rounding = 10

    # Enable background blur
    blur = true

    # Blur radius
    blur_size = 8

    # Blur passes (higher = smoother but more expensive)
    blur_passes = 2

    # Blur background opacity
    blur_opacity = 0.9

    # Enable drop shadows
    drop_shadow = true

    # Shadow range
    shadow_range = 20

    # Shadow intensity (1-4)
    shadow_render_power = 3

    # Shadow color
    col.shadow = rgba(11111bee)

    # Shadow offset
    shadow_offset = 0 4

    # Inactive window opacity (0.0 - 1.0)
    inactive_opacity = 0.9

    # Active window opacity
    active_opacity = 1.0

    # Fullscreen opacity
    fullscreen_opacity = 1.0

    # Dim inactive windows
    dim_inactive = true
    dim_strength = 0.1
}

# ═══════════════════════════════════════════════════════════════════════════════
# ANIMATION SETTINGS
# ═══════════════════════════════════════════════════════════════════════════════

animations {
    # Enable animations globally
    enabled = true

    # Custom bezier curves
    # Format: bezier = name, x1, y1, x2, y2
    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    bezier = smooth, 0.25, 0.1, 0.25, 1.0
    bezier = snappy, 0.4, 0.0, 0.2, 1.0
    bezier = bounce, 0.68, -0.55, 0.27, 1.55

    # Animation definitions
    # Format: animation = name, enabled(0/1), speed(ms), curve, style(optional)
    animation = windowsIn, 1, 200, overshot, popin 80%
    animation = windowsOut, 1, 150, smooth, popin 80%
    animation = windowsMove, 1, 200, snappy
    animation = fade, 1, 150, smooth
    animation = workspaces, 1, 300, smooth, slide
    animation = border, 1, 200, smooth
    animation = borderangle, 1, 100, smooth, loop
}

# ═══════════════════════════════════════════════════════════════════════════════
# LAYOUT: DWINDLE
# ═══════════════════════════════════════════════════════════════════════════════

dwindle {
    # Enable pseudotiling (floating size in tiled position)
    pseudotile = true

    # Preserve split direction on window close
    preserve_split = true

    # Force split direction: 0 = auto, 1 = horizontal, 2 = vertical
    force_split = 0

    # Smart split based on cursor position
    smart_split = false

    # Smart resize (resize affects neighbors)
    smart_resizing = true

    # Default split ratio (0.0 - 1.0)
    split_ratio = 0.5
}

# ═══════════════════════════════════════════════════════════════════════════════
# LAYOUT: MASTER
# ═══════════════════════════════════════════════════════════════════════════════

master {
    # New windows become master
    new_is_master = true

    # Master window orientation: left, right, top, bottom
    orientation = left

    # Master area width ratio
    mfact = 0.55

    # Allow master to be empty
    allow_small_split = false

    # Smart spacing when only one window
    smart_resizing = true
}

# ═══════════════════════════════════════════════════════════════════════════════
# INPUT SETTINGS
# ═══════════════════════════════════════════════════════════════════════════════

input {
    # Keyboard repeat rate (characters per second)
    repeat_rate = 50

    # Delay before repeat starts (ms)
    repeat_delay = 300

    # Follow focus with mouse
    follow_mouse = 1

    # Mouse sensitivity
    sensitivity = 0.0
}

# ═══════════════════════════════════════════════════════════════════════════════
# MISC SETTINGS
# ═══════════════════════════════════════════════════════════════════════════════

misc {
    # Disable hyprland logo on startup
    disable_splash = true

    # Disable random background on empty workspace
    disable_random_bg = true

    # Animate manual resize
    animate_manual_resizes = true

    # Animate mouse-driven resize
    animate_mouse_windowdragging = false

    # Enable window swallowing
    enable_swallow = false

    # Focus on window open
    focus_on_activate = true

    # New window takes focus
    new_window_takes_focus = true
}

# ═══════════════════════════════════════════════════════════════════════════════
# WORKSPACE SETTINGS
# ═══════════════════════════════════════════════════════════════════════════════

workspace {
    # Number of workspaces
    count = 10

    # Remember workspace per application
    remember_per_app = false

    # Default workspace for new windows
    default = 1
}

# ═══════════════════════════════════════════════════════════════════════════════
# BAR SETTINGS (HyprBar / Waybar-style)
# ═══════════════════════════════════════════════════════════════════════════════

bar {
    # Enable status bar
    enabled = true

    # Bar position: top, bottom
    position = top

    # Bar height in pixels
    height = 32

    # Bar background (supports transparency)
    background = rgba(1e1e2ee6)

    # Bar modules (left | center | right separated by |)
    modules_left = workspaces, window_title
    modules_center = clock
    modules_right = tray, network, audio, battery, power

    # Workspace indicator style: numbers, dots, icons
    workspace_style = numbers
}

# ═══════════════════════════════════════════════════════════════════════════════
# INCLUDE MODULAR CONFIGS
# ═══════════════════════════════════════════════════════════════════════════════

source = keybinds.conf
source = rules.conf
source = theme.conf
